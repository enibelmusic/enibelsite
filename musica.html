<style>
  :root{
    --mist:#F2F8EF;
    --ice-green:#DDF0D4;
    --mint:#AED9A0;
    --gold-light:#F7E090;
    --blush:#FBEAF0;
    --cherry:#993556;
    --white:#FAFAF8;
    --gray:#888780;
    --obsidian:#2C2C2A;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ font-family:var(--sans); color:var(--obsidian); background:var(--mist); -webkit-font-smoothing:antialiased; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; }
  h1,h2,h3{ font-family:var(--serif); font-weight:500; line-height:1.05; letter-spacing:-.01em; }
  .wrap-narrow{ max-width:760px; margin:0 auto; padding:0 48px; }
  @media(max-width:900px){ .wrap-narrow{ padding:0 20px; } }

  header{
    position:sticky; top:0; z-index:100;
    background:rgba(242,248,239,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(44,44,42,.08);
  }
  .nav-inner{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:16px 48px; gap:16px;
  }
  @media(max-width:900px){ .nav-inner{ padding:14px 20px; } }
  .back-link{
    justify-self:start; display:flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--obsidian);
  }
  .back-link svg{ width:16px; height:16px; }
  .logo-mark{ justify-self:center; }
  .logo-mark img{ width:34px; height:34px; object-fit:contain; }

  .m-hero{
    padding:56px 0 40px;
    background:linear-gradient(120deg, var(--ice-green) 0%, var(--blush) 55%, var(--gold-light) 100%);
    text-align:center;
  }
  .m-icon-big{
    width:64px; height:64px; border-radius:50%; margin:0 auto 22px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.6); color:var(--cherry); border:1px solid rgba(153,53,86,.25);
  }
  .m-icon-big svg{ width:28px; height:28px; }
  .m-hero h1{ font-size:clamp(34px,6vw,58px); color:var(--cherry); }

  .m-meta{
    margin-top:26px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px 28px;
  }
  .m-meta-item{ display:flex; align-items:center; gap:7px; font-size:13px; color:#5c5b56; }
  .m-meta-item b{ color:var(--obsidian); font-weight:600; }
  .m-meta-item svg{ width:15px; height:15px; color:var(--cherry); flex:none; }

  .m-tabs-section{ padding:44px 0 64px; background:var(--white); }
  .m-tabs{ display:flex; gap:10px; justify-content:center; margin-bottom:32px; }
  .m-tab{
    padding:11px 26px; border-radius:999px; border:1.5px solid rgba(44,44,42,.18);
    font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
    color:var(--obsidian); background:var(--white); transition:all .2s ease;
  }
  .m-tab.active{ background:var(--mint); border-color:var(--mint); color:#1c2f10; }

  .m-panel{ display:none; }
  .m-panel.active{ display:block; }

  .m-lyrics-full{
    font-size:16px; line-height:1.85; color:#4a4944; font-weight:300;
    white-space:pre-line;
  }

  .m-lyrics-full,
  .m-meaning{
    padding:40px 36px;
    border-radius:20px;
    background:rgba(233,245,230,.72);
    border:1px solid rgba(44,44,42,.08);
  }

  @media(max-width:600px){
    .m-lyrics-full,
    .m-meaning{ padding:32px 26px; }
  }

  .m-meaning p{ font-size:16px; line-height:1.85; color:#4a4944; font-weight:300; }
  .m-meaning p + p{ margin-top:20px; }
  .m-meaning .lead{ font-family:var(--serif); font-style:italic; font-size:19px; color:var(--cherry); line-height:1.5; margin-bottom:22px; }

  .m-actions{ margin-top:48px; display:flex; flex-direction:column; gap:12px; }
  .m-action-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px 24px; border-radius:999px;
    font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
  }
  .m-action-btn svg{ width:15px; height:15px; flex:none; }
  .m-action-btn.spotify{ background:linear-gradient(160deg,#eaf7de,var(--mint) 85%); color:#1c2f10; box-shadow:0 14px 26px -12px rgba(44,61,22,.4); }
  .m-action-btn.youtube{ border:1.5px solid rgba(44,44,42,.2); color:var(--obsidian); }
  .m-action-btn.share{ border:1.5px solid rgba(44,44,42,.2); color:var(--obsidian); }
  .m-action-btn.back{ background:var(--obsidian); color:var(--white); }
  .m-action-btn.copied{ background:var(--mint) !important; color:#1c2f10 !important; border-color:var(--mint) !important; }

  .m-share-link{
    margin-top:6px; font-size:11.5px; color:var(--gray); text-align:center; word-break:break-all;
  }

  footer{ background:var(--obsidian); color:var(--white); padding:65px 0 0; }
  .footer-top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:48px; padding-bottom:36px; }
  .footer-logo{ display:flex; align-items:center; gap:12px; }
  .footer-tag{ font-family:var(--serif); font-size:22px; font-style:italic; color:rgba(250,250,248,.75); line-height:1.3; }
  .footer-email{ display:inline-block; font-size:14px; letter-spacing:.02em; color:var(--ice-green); border-bottom:1px solid rgba(174,217,160,.35); padding-bottom:2px; transition:color .2s ease, border-color .2s ease; }
  .footer-email:hover{ color:var(--gold-light); border-color:var(--gold-light); }
  .footer-right{ display:flex; align-items:center; gap:28px; }
  .footer-email-col{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .footer-socials{ display:flex; align-items:center; gap:14px; }
  .footer-socials a{ display:flex; color:#AED9A0; transition:opacity .2s ease; }
  .footer-socials a:hover{ opacity:.7; }
  .footer-socials svg{ width:18px; height:18px; }
  .back-top{
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(250,250,248,.3); flex:none;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease; color:var(--white);
  }
  .back-top:hover{ background:var(--white); color:var(--obsidian); }
  .back-top svg{ width:16px; height:16px; }
  .footer-bottom{
    border-top:1px solid rgba(250,250,248,.14);
    padding:15px 0; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px;
    font-size:11.5px; letter-spacing:.04em; color:rgba(250,250,248,.55);
  }
  @media(max-width:700px){ .footer-top{ flex-direction:column; gap:32px; } .footer-right{ width:100%; justify-content:space-between; } }

  .m-notfound{ text-align:center; padding:120px 20px; }
  .m-notfound h2{ font-size:28px; color:var(--cherry); margin-bottom:14px; }
</style>
</head>

  // Base de dados das músicas e significados da artista.
  const songs = {
    'o-segredo': { name:'O Segredo', icon:'star', album:'Prazer, Enibel, Pt. 2', year:'2025',
      spotify:'https://open.spotify.com/intl-pt/track/1epj007y8j3FJ0xkeAxMDJ',
      youtube:'https://www.youtube.com/watch?v=EYH-L4GmacI',
      meaning:['"O Segredo", de Enibel, fala sobre a conexão profunda com aquilo que desejamos, mesmo quando ainda não conseguimos explicar o que sentimos. Esse desejo pode ser uma pessoa, um amor, um sonho, uma conquista ou uma realidade que queremos viver.',
        'A Lua, o céu e as estrelas reforçam o universo mágico da música e representam liberdade, orientação e confiança no caminho. Ao mesmo tempo, a letra mostra que desejar algo também pode nos levar para dentro: ao fazer as pazes com a solidão, a personagem se encontra e compreende melhor seus próprios sentimentos.',
        'A intenção da música é fazer o ouvinte se conectar com seus desejos, confiar mais no que sente e se permitir sonhar, reconhecendo que aquilo que buscamos também pode revelar novas partes de quem somos.'] },
    'pouca-coisa-me-interessa': { name:'Pouca Coisa Me Interessa', icon:'bolt', album:'Prazer, Enibel, Pt. 2', year:'2025',
      spotify:'https://open.spotify.com/intl-pt/track/2wmg2DBAxl1bhEEUNlQWnC',
      youtube:'https://www.youtube.com/watch?v=tNR6XzQtyQs',
      meaning:['"Pouca Coisa Me Interessa", de Enibel, fala sobre escolher onde colocar a própria energia e ter coragem de priorizar aquilo que realmente importa. A música retrata uma fase de autoconhecimento, foco nos próprios sonhos e afastamento de pessoas, ambientes e distrações que já não combinam com quem se deseja ser.',

        'A intenção da música é fazer o ouvinte olhar para si, reconhecer o que realmente importa e ter coragem de proteger seus sonhos, sua energia e sua autenticidade, sem permitir que o medo ou a necessidade de aprovação desviem seu caminho.'] },
    'roda-da-fortuna': { name:'Roda da Fortuna', icon:'dollar', album:'Prazer, Enibel, Pt. 2', year:'2025',
      spotify:'https://open.spotify.com/intl-pt/track/55eGzxJJ1cj6PrldCCDnF2',
      youtube:null,
      meaning:['"Roda da Fortuna", de Enibel, fala sobre os ciclos da vida, a transformação e a construção da própria prosperidade. Inspirada no simbolismo da Roda da Fortuna do tarô, a música representa a vida em constante movimento e a capacidade de transformar mudanças, desafios e aprendizados em crescimento.',
        'A letra conecta prosperidade, espiritualidade e manifestação, mostrando que conquistas externas também podem caminhar ao lado da evolução interior. O número sete reforça a ideia de crescimento espiritual e conexão, enquanto a mensagem central lembra que pensamentos, palavras e intenções também influenciam a realidade que escolhemos construir.',
        'A intenção da música é fazer o ouvinte reconhecer seu próprio poder de transformação, confiar nos ciclos da vida e se abrir para a prosperidade, mantendo consciência sobre aquilo que pensa, acredita e deseja criar para si.'] },
    '20e20': { name:'20e20', icon:'heart', album:'Prazer, Enibel, Pt. 2', year:'2025',

      meaning:['"20e20", de Enibel, fala sobre uma conexão profunda entre duas pessoas que ultrapassa o físico, o consciente e o racional. A música explora uma sintonia emocional, energética e inconsciente, capaz de continuar existindo através dos sonhos e da conexão com o outro mesmo sem sua presença física.',
        'O horário 20:20 representa sincronicidade e reforça a ideia de que alguns encontros e conexões parecem acontecer além da lógica. A atmosfera de sonho e mistério representa esse espaço entre o consciente e o inconsciente, onde duas pessoas podem continuar se encontrando e se conectando de formas que nem sempre conseguem explicar.',

        'A letra reforça que nenhuma opinião externa deve ter mais força do que a percepção do próprio valor, incentivando a proteger o próprio brilho, respeitar quem se tornou e não depender da aprovação dos outros para se sentir suficiente.',

    'lobo-e-peixe': { name:'Lobo e Peixe', icon:'dollar', album:'Prazer, Enibel', year:'2024',

    document.title = song.name + ' — Enibel';

      const label = btn.innerHTML;
      function done(){
        btn.classList.add('copied');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg> Link copiado!';

      if (navigator.share){
        navigator.share({ title: song.name + ' — Enibel', url: shareUrl }).catch(() => {});

      } else {
