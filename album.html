<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enibel — Biblioteca Musical</title>
<meta name="description" content="Álbuns, faixas e letras de Enibel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mist:#F2F8EF;
    --ice-green:#DDF0D4;
    --mint:#AED9A0;
    --gold-light:#F7E090;
    --blush:#FBEAF0;
    --cherry:#993556;
    --white:#FAFAF8;
    --gray:#888780;
    --obsidian:#2C2C2A;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ font-family:var(--sans); color:var(--obsidian); background:var(--mist); -webkit-font-smoothing:antialiased; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; }
  h1,h2,h3{ font-family:var(--serif); font-weight:500; line-height:1.05; letter-spacing:-.01em; }
  .wrap-narrow{ max-width:820px; margin:0 auto; padding:0 48px; }
  @media(max-width:900px){ .wrap-narrow{ padding:0 20px; } }

  header{
    position:sticky; top:0; z-index:100;
    background:rgba(242,248,239,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(44,44,42,.08);
  }
  .nav-inner{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:16px 48px; gap:16px;
  }
  @media(max-width:900px){ .nav-inner{ padding:14px 20px; } }
  .back-link{
    justify-self:start; display:flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--obsidian);
  }
  .back-link svg{ width:16px; height:16px; }
  .logo-mark{ justify-self:center; }
  .logo-mark img{ width:34px; height:34px; object-fit:contain; }

  .al-hero{
    padding:56px 0 48px;
    background:linear-gradient(120deg, var(--ice-green) 0%, var(--blush) 55%, var(--gold-light) 100%);
  }
  .al-hero-grid{ display:flex; gap:44px; align-items:center; }
  @media(max-width:760px){ .al-hero-grid{ flex-direction:column; text-align:center; gap:28px; } }
  .al-cover{
    width:240px; height:240px; border-radius:24px; object-fit:cover; flex:none;
    box-shadow:0 24px 40px -18px rgba(44,44,42,.35), inset 0 0 0 1px rgba(255,255,255,.4);
  }
  @media(max-width:760px){ .al-cover{ width:190px; height:190px; margin:0 auto; } }
  .al-meta-label{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--cherry); }
  .al-hero-info h1{ font-size:clamp(32px,5vw,50px); color:var(--cherry); margin-top:8px; }
  .al-desc{ margin-top:16px; font-size:15px; line-height:1.7; color:#4a4944; font-weight:300; max-width:520px; }
  @media(max-width:760px){ .al-desc{ margin-left:auto; margin-right:auto; } }
  .al-hero-info .m-action-btn{ margin-top:26px; display:inline-flex; width:auto; }

  .m-action-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 26px; border-radius:999px;
    font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
  }
  .m-action-btn svg{ width:15px; height:15px; flex:none; }
  .m-action-btn.spotify{ background:linear-gradient(160deg,#eaf7de,var(--mint) 85%); color:#1c2f10; box-shadow:0 14px 26px -12px rgba(44,61,22,.4); }
  .m-action-btn.back{ background:var(--obsidian); color:var(--white); }

  .al-tracks-section{ padding:56px 0 70px; background:var(--white); }
  .al-tracks-title{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--cherry); padding-bottom:20px; border-bottom:1px solid rgba(44,44,42,.14); margin-bottom:12px; }

  .track-row{
    display:flex; align-items:center; gap:16px;
    padding:16px 0; border-bottom:1px solid rgba(44,44,42,.12);
    transition:background .25s ease, padding .25s ease, margin .25s ease;
  }
  .track-row:hover{ background:var(--blush); margin:0 -16px; padding:16px 16px; }
  .track-row:hover .tname{ transform:scale(1.04); }
  .track-row:hover .tcap{ transform:scale(1.03); }
  .track-row .tname, .track-row .tcap{ display:inline-block; transform-origin:left center; transition:transform .25s ease; }
  .track-num{ font-size:13px; color:var(--gray); width:20px; flex:none; }
  .track-icon{ width:26px; height:26px; flex:none; color:var(--cherry); display:flex; align-items:center; justify-content:center; }
  .track-icon svg{ width:19px; height:19px; }
  .track-info{ flex:1; min-width:0; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .track-info .tname{ font-family:var(--serif); font-size:24px; font-weight:600; display:inline; }
  .track-info .tcap{ display:inline-block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); margin-top:0; }
  .track-actions{ display:flex; align-items:flex-start; gap:18px; flex:none; }
  .track-action{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .play-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(44,44,42,.3); flex:none;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease;
  }
  .play-btn:hover{ background:var(--cherry); border-color:var(--cherry); color:var(--white); }
  .play-btn svg{ width:15px; height:15px; margin-left:1px; }
  .lyrics-btn svg{ width:16px; height:16px; margin-left:0; }
  .ta-label{ font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); font-weight:600; }

  .al-back-wrap{ text-align:center; margin-top:44px; }

  footer{ background:var(--obsidian); color:var(--white); padding:65px 0 0; }
  .footer-top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:48px; padding-bottom:36px; }
  .footer-logo{ display:flex; align-items:center; gap:12px; }
  .footer-tag{ font-family:var(--serif); font-size:22px; font-style:italic; color:rgba(250,250,248,.75); line-height:1.3; }
  .footer-email{ display:inline-block; font-size:14px; letter-spacing:.02em; color:var(--ice-green); border-bottom:1px solid rgba(174,217,160,.35); padding-bottom:2px; transition:color .2s ease, border-color .2s ease; }
  .footer-email:hover{ color:var(--gold-light); border-color:var(--gold-light); }
  .footer-right{ display:flex; align-items:center; gap:28px; }
  .footer-email-col{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .footer-socials{ display:flex; align-items:center; gap:14px; }
  .footer-socials a{ display:flex; color:#AED9A0; transition:opacity .2s ease; }
  .footer-socials a:hover{ opacity:.7; }
  .footer-socials svg{ width:18px; height:18px; }
  .back-top{
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(250,250,248,.3); flex:none;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease; color:var(--white);
  }
  .back-top:hover{ background:var(--white); color:var(--obsidian); }
  .back-top svg{ width:16px; height:16px; }
  .footer-bottom{
    border-top:1px solid rgba(250,250,248,.14);
    padding:15px 0; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px;
    font-size:11.5px; letter-spacing:.04em; color:rgba(250,250,248,.55);
  }
  @media(max-width:700px){ .footer-top{ flex-direction:column; gap:32px; } .footer-right{ width:100%; justify-content:space-between; } }

  .al-notfound{ text-align:center; padding:120px 20px; }
  .al-notfound h2{ font-size:28px; color:var(--cherry); margin-bottom:14px; }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="biblioteca-musical" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar à biblioteca
    </a>
    <a href="/" class="logo-mark"><img src="images/logo.webp" alt="Enibel"></a>
    <span></span>
  </div>
</header>

<div id="pageContent"></div>

<footer>
  <div class="wrap-narrow">
    <div class="footer-top">
      <div class="footer-logo">
        <img src="images/logo.webp" alt="Enibel" style="width:44px;height:44px;object-fit:contain;" width="394" height="400" loading="lazy" decoding="async">
        <p class="footer-tag" style="margin:0;white-space:nowrap;">Arte, Evolução &amp; Manifestação.</p>
      </div>
      <div class="footer-right">
        <div class="footer-email-col">
          <a href="mailto:contato@enibel.com.br" class="footer-email">contato@enibel.com.br</a>
          <div class="footer-socials">
            <a href="https://www.instagram.com/enibeloficial/" target="_blank" rel="noopener" aria-label="Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
            </a>
            <a href="https://www.tiktok.com/@enibeloficial" target="_blank" rel="noopener" aria-label="TikTok">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 4v9.5a3.5 3.5 0 1 1-3-3.46"/><path d="M14 4c.6 2.4 2.2 4 5 4.3"/></svg>
            </a>
            <a href="https://www.youtube.com/@Enibel" target="_blank" rel="noopener" aria-label="YouTube">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10 9.5v5l5-2.5z" fill="currentColor" stroke="none"/></svg>
            </a>
          </div>
        </div>
        <button class="back-top" id="backTop" aria-label="Voltar ao topo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 ENIBEL. Todos os direitos reservados.</span>
    </div>
  </div>
</footer>

<script>
  const backTopBtn = document.getElementById('backTop');
  if (backTopBtn) backTopBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>

<script>
  const CATEGORY_LABELS = { heart:'Amor', dollar:'Prosperidade', star:'Expansão', sprout:'Evolução', sun:'Bem-estar', bolt:'Poder Pessoal' };
  const LYRICS_URL = 'https://www.letras.mus.br/enibel/';
  const ICONS = {
    heart:'<path d="M12 20s-7-4.4-9.5-9C.7 7.3 3 4 6.5 4 9 4 11 6 12 8c1-2 3-4 5.5-4C21 4 23.3 7.3 21.5 11 19 15.6 12 20 12 20Z" fill="currentColor"/>',
    dollar:'<path d="M12 2v20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    sun:'<circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    bolt:'<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/>',
    sprout:'<path d="M12 13c-1.2-3.6-4.8-5.4-8-4.6 1 3.8 4.2 6 8 5.6z" fill="currentColor"/><path d="M12 13c.8-4.6 5-7.4 9-6.8-.8 4.4-4.6 7.2-9 7.2z" fill="currentColor"/><path d="M12 21v-7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    star:'<path d="m12 2 2.9 6.3L21 9l-5 4.4L17.4 21 12 17.6 6.6 21 8 13.4 3 9l6.1-.7L12 2Z" fill="currentColor"/>'
  };

  // Base de dados dos álbuns da artista.
  const albums = {
    'prazer-enibel': {
      title:'Prazer, Enibel', meta:'Álbum · 2024 · 11 faixas', img:'images/album-1.webp',
      desc:'Meu primeiro manifesto: um som vibrante, intenso e nada óbvio, criado para elevar, ativar e transformar.',
      spotify:'https://open.spotify.com/intl-pt/album/0Scxpk2Xej5lnqVwy8wcWq',
      tracks:[
        {name:'Eu Não Ligo', cap:'Autoestima e merecimento', icon:'sun', url:'https://open.spotify.com/intl-pt/track/2WdxfNbuJvmpp9NicZZrCZ', slug:'eu-nao-ligo'},
        {name:'Nada Me Para', cap:'Foco e superação', icon:'bolt', url:'https://open.spotify.com/intl-pt/track/1EYw017xpq8EwCzJy1D0zb', slug:'nada-me-para'},
        {name:'Interestelar', cap:'Abertura para novas possibilidades', icon:'star', url:'https://open.spotify.com/intl-pt/track/0tnfhjdXb1b7F2YZIUskul', slug:'interestelar'},
        {name:'Blocos de Notas', cap:'Sucesso profissional e financeiro', icon:'dollar', url:'https://open.spotify.com/intl-pt/track/5H4wm6UnwufuCvODZFbuVU', slug:'blocos-de-notas'},
        {name:'Elevo o Nível', cap:'Transformação mental, material e espiritual', icon:'sprout', url:'https://open.spotify.com/intl-pt/track/04DlSg6Rm5K862cHNP4i2g', slug:'elevo-o-nivel'},
        {name:'Lobo e Peixe', cap:'Prosperidade material', icon:'dollar', url:'https://open.spotify.com/intl-pt/track/6kjoMIBUQxv8KFCavAB5OZ', slug:'lobo-e-peixe'},
        {name:'777', cap:'Calma, orientação e conexão superior', icon:'star', url:'https://open.spotify.com/intl-pt/track/1R35vvUP5xKLGm0s3aNzGq', slug:'777'},
        {name:'44', cap:'Autoconfiança e coragem', icon:'bolt', url:'https://open.spotify.com/intl-pt/track/0RsGMLRSqZSSllmqlLREpN', slug:'44'},
        {name:'369', cap:'Expansão de consciência e grandes realizações', icon:'star', url:'https://open.spotify.com/intl-pt/track/203UCQOSeImaC77EFUn6OY', slug:'369'},
        {name:'5D', cap:'Conexão amorosa', icon:'heart', url:'https://open.spotify.com/intl-pt/track/3vOqfeVKYbznvkfdN7nFQR', slug:'5d'},
        {name:'666', cap:'Magnetismo e atração amorosa', icon:'heart', url:'https://open.spotify.com/intl-pt/track/1lT2IiYNv8akvQpjnw3yLv', slug:'666'}
      ]
    },
    'prazer-enibel-pt-2': {
      title:'Prazer, Enibel, Pt. 2', meta:'EP · 2025 · 5 faixas', img:'images/album-2.webp',
      desc:'Um fechamento delicado e intenso para o primeiro capítulo. Leveza e profundidade para abundância, vitória, conexão e novas perspectivas.',
      spotify:'https://open.spotify.com/intl-pt/album/2gu6FqPufvhMcVn8ZYsegB',
      tracks:[
        {name:'O Segredo', cap:'Realização dos desejos da alma', icon:'star', url:'https://open.spotify.com/intl-pt/track/1epj007y8j3FJ0xkeAxMDJ', slug:'o-segredo'},
        {name:'Pouca Coisa Me Interessa', cap:'Foco elevado e liberação do passado', icon:'bolt', url:'https://open.spotify.com/intl-pt/track/2wmg2DBAxl1bhEEUNlQWnC', slug:'pouca-coisa-me-interessa'},
        {name:'Roda da Fortuna', cap:'Dinheiro, abundância e prosperidade', icon:'dollar', url:'https://open.spotify.com/intl-pt/track/55eGzxJJ1cj6PrldCCDnF2', slug:'roda-da-fortuna'},
        {name:'20e20', cap:'Conexão emocional através dos sonhos', icon:'heart', url:'https://open.spotify.com/intl-pt/track/4S0meYCGUpYdT9qYA8QZAl', slug:'20e20'},
        {name:'Telepatia', cap:'Conexão mental com outra pessoa', icon:'heart', url:'https://open.spotify.com/intl-pt/track/4aHUkIPbGPkBeFH7guKV6I', slug:'telepatia'}
      ]
    },
    'alquimidas': {
      title:'ALQUIMIDAS', meta:'EP Experimental · 2024 · 5 faixas', img:'images/album-3.webp',
      desc:'Meu primeiro projeto experimental de música eletrônica, criado para ativar frequências específicas em cada faixa.',
      spotify:'https://open.spotify.com/intl-pt/album/6IqxuOUEjMmcYx7FvM6Jhb',
      tracks:[
        {name:'Ecoa Dismu · 480Hz', cap:'Desejos da alma e magnetismo pessoal', icon:'star', url:null},
        {name:'Tem Que Acreditar · 720Hz', cap:'Fé fortalecida para realizações', icon:'sprout', url:null},
        {name:'Samplim · 800Hz', cap:'Abundância e prosperidade', icon:'dollar', url:null},
        {name:'Love · 528Hz', cap:'Amor, magnetismo e sedução', icon:'heart', url:null},
        {name:'369 Wave · 369Hz', cap:'Expansão para grandes manifestações', icon:'star', url:null}
      ]
    },
    'rosas-vermelhas': {
      title:'Rosas Vermelhas', meta:'Single · 2025 · 1 faixa', img:'images/release-cover.webp',
      desc:'Um projeto sobre amor e magnetismo pessoal, conduzindo o ouvinte por uma atmosfera onde poder e vulnerabilidade se encontram.',
      spotify:'https://open.spotify.com/intl-pt/track/4ITLmVsXMm2pHaAF99V49R',
      tracks:[
        {name:'Rosas Vermelhas', cap:'Paixão e magnetismo amoroso', icon:'heart', url:'https://open.spotify.com/intl-pt/track/4ITLmVsXMm2pHaAF99V49R', slug:'rosas-vermelhas'}
      ]
    }
  };

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const album = albums[id];
  const content = document.getElementById('pageContent');

  if (!album){
    content.innerHTML = `
      <div class="al-notfound">
        <h2>Álbum não encontrado</h2>
        <p style="color:var(--gray);">O link pode estar incompleto. Volte para a biblioteca e escolha um álbum.</p>
        <a href="biblioteca-musical" class="m-action-btn back" style="display:inline-flex; margin-top:24px;">Voltar à biblioteca</a>
      </div>`;
  } else {
    document.title = album.title + ' — Enibel';

    function trackRow(t, i){
      const lyricsHref = t.slug ? ('musica?id=' + t.slug) : LYRICS_URL;
      const lyricsTarget = t.slug ? '' : ' target="_blank" rel="noopener"';
      return `<div class="track-row">
        <span class="track-num">${String(i+1).padStart(2,'0')}</span>
        <span class="track-icon"><svg viewBox="0 0 24 24">${ICONS[t.icon]}</svg></span>
        <span class="track-info"><span class="tname">${t.name}</span><span class="tcap">${CATEGORY_LABELS[t.icon]} · ${t.cap}</span></span>
        <span class="track-actions">
          <a class="track-action" href="${t.url || album.spotify}" target="_blank" rel="noopener" aria-label="Ouvir ${t.name}">
            <span class="play-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
            <span class="ta-label">Ouvir</span>
          </a>
          <a class="track-action" href="${lyricsHref}"${lyricsTarget} aria-label="Ver letra de ${t.name}">
            <span class="play-btn lyrics-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>
            <span class="ta-label">Ver letra</span>
          </a>
        </span>
      </div>`;
    }

    content.innerHTML = `
      <section class="al-hero">
        <div class="wrap-narrow">
          <div class="al-hero-grid">
            <img class="al-cover" src="${album.img}" alt="${album.title}">
            <div class="al-hero-info">
              <span class="al-meta-label">${album.meta}</span>
              <h1>${album.title}</h1>
              <p class="al-desc">${album.desc}</p>
              <a class="m-action-btn spotify" href="${album.spotify}" target="_blank" rel="noopener">
                <svg viewBox="0 0 168 168" fill="currentColor"><path d="M83.996 0C37.747 0 .001 37.747.001 84s37.746 84 83.995 84c46.251 0 84.001-37.747 84.001-84S130.246 0 83.996 0zm38.503 121.052c-1.507 2.471-4.733 3.253-7.204 1.744-19.732-12.058-44.588-14.79-73.848-8.104-2.82.645-5.63-1.12-6.275-3.94-.643-2.82 1.115-5.63 3.94-6.275 32.017-7.317 59.492-4.169 81.643 9.371 2.471 1.51 3.252 4.734 1.744 7.204zm10.283-22.9c-1.9 3.093-5.943 4.07-9.036 2.17-22.591-13.888-57.028-17.912-83.766-9.798-3.49 1.056-7.174-.909-8.23-4.397-1.055-3.49.91-7.173 4.398-8.23 30.583-9.28 68.545-4.79 94.462 11.223 3.093 1.9 4.07 5.942 2.17 9.036zm.888-23.855c-27.098-16.096-71.788-17.575-97.653-9.72-4.183 1.269-8.6-1.098-9.869-5.281-1.269-4.184 1.099-8.601 5.282-9.87 29.685-9.005 79.081-7.269 110.376 11.376 3.762 2.238 4.995 7.098 2.755 10.858-2.235 3.76-7.097 4.999-10.857 2.755z"/></svg>
                Ouvir álbum completo
              </a>
            </div>
          </div>

      <section class="al-tracks-section">

          <div class="al-tracks-list">
            ${album.tracks.map(trackRow).join('')}

    `;
  }
</script>
